schema_version: "2026-09-23"
project:
  name: "SENTINEL SOC Defense"
  purpose: "Provenance-aware defense layer for tool-using AI agents"
  repository_license: "not-specified-in-repository"

models:
  - id: "Qwen3-8B"
    role: "official SENTINEL reference model"
    provider: "SENTINEL challenge specification"
    version: "reference-model"
    use: "simulator baseline / benchmark reference"
    license: "see model provider terms"
  - id: "openai/gpt-oss-120b"
    role: "optional AgentDojo and extraction evaluation model"
    provider: "Groq-compatible OpenAI API"
    version: "configured by deployment"
    use: "optional LLM-backed extraction and AgentDojo bridge"
    license: "see model provider terms"
  - id: "text-embedding-3-small"
    role: "research comparison only"
    provider: "OpenAI"
    version: "as reported by MELON v3"
    use: "not required by the local deterministic implementation"
    license: "see OpenAI terms"

datasets:
  - id: "public-soc-scenarios"
    description: "Checked-in public SOC scenario artifacts and 13-scenario local demo set"
    source: "SENTINEL starter kit / repository results"
    version: "local checkout"
    count: 13
    license: "starter-kit terms / verify upstream license"
  - id: "AgentDojo"
    description: "Indirect prompt-injection benchmark used by the optional integration"
    source: "https://github.com/ethz-spylab/agentdojo"
    version: "configured by installed package"
    use: "optional external benchmark"
    license: "see upstream repository license"
  - id: "MELON-AgentDojo-results"
    description: "Published comparison results cited in the technical report"
    source: "https://arxiv.org/html/2502.05174v3"
    version: "v3"
    use: "literature comparison, not local training data"
    license: "CC BY 4.0"

external_services:
  - id: "Groq"
    use: "optional OpenAI-compatible endpoint for extraction / AgentDojo"
    credentials: "GROQ_API_KEY"
  - id: "OpenAI-compatible-embedding-service"
    use: "described by MELON; not required by local implementation"
    status: "research reference only"
